services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arbitrage-bot-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./arbitrage.db:/app/arbitrage.db
      - ./operator_vault.db:/app/operator_vault.db
      - ./gru_model.pth:/app/gru_model.pth
      - ./scaler_params.npy:/app/scaler_params.npy
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: arbitrage-bot-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
